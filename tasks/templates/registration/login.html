{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container min-vh-75 d-flex align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-6 col-sm-5 border border-dark-subtle rounded p-4">
            <h2>Log In</h2>
            <form method="post">
                {% csrf_token %}
                <div>
                    <label for="{{ form.username.id_for_label }}"></label>
                    <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                        class="form-control" placeholder="Your username" required>
                </div>

                <div>

                    <label for="{{ form.password.id_for_label }}"></label>
                    <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                        class="form-control" placeholder="Your password" required>

                </div>

                {% if form.non_field_errors %}
                <div class="mt-4 text-danger">
                    {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                    {% endfor %}
                </div>
                {% endif %}

                <button type="submit" class="btn btn-dark w-100 mt-4">Log In</button>

            </form>
        </div>

    </div>

</div>

{% endblock %}
