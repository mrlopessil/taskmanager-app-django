{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Task Manager{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .task-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .min-vh-75 {
            min-height: 75vh;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                TaskManager
            </a>

            {% if user.is_authenticated %}
            <div class="d-flex align-items-center">

                <span class="text-light me-4">Hi, {{ user.username }}</span>

                <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Log Out</button>
                </form>

                {% else %}
                <div>
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                        Login
                    </a>

                    <a href="#" class="btn btn-primary btn-sm">
                        Sign up
                    </a>
                    {% endif %}
                </div>

            </div>
    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="py-4 mt-5 bg-dark text-white">
        <div class="container text-center">
            <small>© 2026 TaskManager</small>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
